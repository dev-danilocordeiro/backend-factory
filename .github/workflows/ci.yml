name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod states the minimum; golangci-lint v2.14 itself needs Go >= 1.26.
          go-version: stable
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: go vet ./...
      - run: go test -race ./...
      - run: golangci-lint run ./...

  # The same gate scripts the pipeline runs, on the example services.
  gates-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod states the minimum; golangci-lint v2.14 itself needs Go >= 1.26.
          go-version: stable
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: for g in build lint arch test; do gates/go.sh "$g" examples/go-service; done

  gates-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: for g in build lint arch test; do gates/java-maven.sh "$g" examples/java-service; done
